<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MINDVERSE</title>
<style>body{background:#101b30;color:#fff;font:17px system-ui;margin:0;padding:14px}main{max-width:850px;margin:auto}canvas{width:100%;border-radius:12px;background:#29445a;touch-action:none}button{background:#275c87;color:white;border:1px solid #8ac5e4;border-radius:12px;padding:13px;margin:4px;font:inherit}.controls{display:flex;justify-content:space-between;align-items:center}#dialog{background:#1c324f;padding:14px;border-radius:12px;margin-top:12px}#choices button{display:block;width:100%}</style></head><body><main><h1>🧠 MINDVERSE · NEXUS</h1><p id="status"></p><canvas id="world" width="800" height="480"></canvas><div class="controls"><div><div style="text-align:center"><button data-key="up">▲</button></div><div><button data-key="left">◀</button><button data-key="down">▼</button><button data-key="right">▶</button></div></div><button id="interact">💬 Interagir</button></div><button id="diary">📖 Diário</button><button id="reset">↻ Reiniciar</button><section id="dialog"><h2 id="title">Bem-vindo a Nexus</h2><p id="message">Toque no mapa ou use as setas para andar. Converse com Lia, Caio e Mara; depois visite o conselho no centro.</p><div id="choices"></div></section><p><small>Pontuação de prática não mede inteligência.</small></p></main>
<script>
const c=document.getElementById('world'),g=c.getContext('2d'),el=id=>document.getElementById(id),characters=[{id:'lia',name:'Lia',x:210,y:120,color:'#83eac8',clue:'Os transformadores estão intactos.'},{id:'caio',name:'Caio',x:600,y:310,color:'#ffd48c',clue:'O hospital tem duas horas de reserva.'},{id:'mara',name:'Mara',x:180,y:320,color:'#ff9acb',clue:'O vídeo sobre sabotagem não foi verificado.'}],buildings=[[50,40,130,110],[620,35,130,115],[50,380,140,75],[340,370,120,75],[660,380,100,75]],storageKey='mindverse-demo-v1';
let state={x:390,y:240,clues:[],chapter:0,decisions:[]};try{const v=JSON.parse(localStorage.getItem(storageKey));if(v&&Array.isArray(v.clues))state={...state,...v}}catch(e){}
let keys={},destination=null,blocked=false;function save(){try{localStorage.setItem(storageKey,JSON.stringify(state))}catch(e){}}
function panel(title,message,options=[]){blocked=true;el('title').textContent=title;el('message').textContent=message;el('choices').replaceChildren();for(const [label,callback] of options){const b=document.createElement('button');b.textContent=label;b.onclick=callback;el('choices').append(b)}}
function close(){blocked=false;el('title').textContent='Explore Nexus';el('message').textContent='Aproxime-se de um personagem e toque em Interagir.';el('choices').replaceChildren()}
function decision(ch,i){state.chapter=ch;state.decisions.push(i);save();const messages=ch===1?['Você encontrou uma falha de distribuição analisando os registros.','O hospital foi protegido, mas a causa continua incerta.','O boato desviou recursos sem evidências.']:['Fontes independentes revelaram uma leitura duplicada.','Um teste controlado confirmou o defeito do sensor.','O vídeo não verificado aumentou a desinformação.'];panel('Consequência',messages[i],[['Continuar',close]])}
function interact(){const p=characters.find(q=>Math.hypot(q.x-state.x,q.y-state.y)<70);if(p){if(!state.clues.includes(p.id))state.clues.push(p.id);save();panel(p.name,p.clue,[['Continuar',close]]);return}if(Math.hypot(state.x-390,state.y-240)<70){if(state.clues.length<3){panel('Conselho','Reúna as três pistas primeiro.',[['Continuar',close]]);return}if(state.chapter===0){panel('Capítulo 01 — O apagão','Como você responde à crise?',[['Investigar registros',()=>decision(1,0)],['Priorizar o hospital',()=>decision(1,1)],['Acusar sabotadores',()=>decision(1,2)]]);return}if(state.chapter===1){panel('Capítulo 02 — O sinal fantasma','Um sensor relata uma nova falha. Qual evidência você busca?',[['Cruzar fontes',()=>decision(2,0)],['Testar sensor',()=>decision(2,1)],['Divulgar vídeo',()=>decision(2,2)]]);return}panel('Nexus','Parabéns! Você concluiu os dois capítulos.',[['Continuar',close]]);return}panel('Exploração','Aproxime-se de um morador ou do círculo amarelo.',[['Continuar',close]])}
function circle(x,y,r,color){g.fillStyle=color;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()}
function draw(){g.fillStyle='#1c394a';g.fillRect(0,0,800,480);g.fillStyle='#536e80';g.fillRect(0,215,800,55);g.fillRect(365,0,55,480);for(const [x,y,w,h] of buildings){g.fillStyle='#0c2031';g.fillRect(x+6,y+7,w,h);g.fillStyle='#60899b';g.fillRect(x,y,w,h)}circle(390,240,32,'#e7c261');g.textAlign='center';g.fillStyle='white';g.font='14px system-ui';g.fillText('CONSELHO',390,290);for(const p of characters){circle(p.x,p.y,15,p.color);g.fillStyle='white';g.fillText(p.name,p.x,p.y-23);if(state.clues.includes(p.id))g.fillText('✓',p.x+24,p.y-10)}circle(state.x,state.y,16,'#7daeff');g.fillStyle='white';g.fillText('VOCÊ',state.x,state.y-24)}
function collision(x,y){return x<17||y<17||x>783||y>463||buildings.some(([a,b,w,h])=>x>a-17&&x<a+w+17&&y>b-17&&y<b+h+17)}
function frame(){if(!blocked){let dx=Number(!!keys.right)-Number(!!keys.left),dy=Number(!!keys.down)-Number(!!keys.up);if(destination){const d=Math.hypot(destination.x-state.x,destination.y-state.y);if(d>7){dx=(destination.x-state.x)/d;dy=(destination.y-state.y)/d}else destination=null}const n=Math.hypot(dx,dy);if(n){const x=state.x+dx/n*3.3,y=state.y+dy/n*3.3;if(!collision(x,state.y))state.x=x;if(!collision(state.x,y))state.y=y}}draw();el('status').textContent='Pistas '+state.clues.length+'/3 · '+(state.chapter===2?'Aventura concluída':state.chapter===1?'Capítulo 02 — O sinal fantasma':'Capítulo 01 — O apagão');requestAnimationFrame(frame)}frame();
for(const b of document.querySelectorAll('[data-key]')){const k=b.dataset.key;b.addEventListener('pointerdown',e=>{b.setPointerCapture(e.pointerId);keys[k]=true;destination=null});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys[k]=false)}
c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect();destination={x:(e.clientX-r.left)*800/r.width,y:(e.clientY-r.top)*480/r.height};blocked=false});el('interact').onclick=interact;el('diary').onclick=()=>panel('Diário','Pistas: '+(state.clues.join(', ')||'nenhuma')+' | Capítulos concluídos: '+state.chapter,[['Fechar',close]]);el('reset').onclick=()=>{if(confirm('Reiniciar o jogo?')){localStorage.removeItem(storageKey);location.reload()}};const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',a:'left',s:'down',d:'right'};addEventListener('keydown',e=>{if(map[e.key]){keys[map[e.key]]=true;destination=null;e.preventDefault()}if(e.key==='Enter')interact()});addEventListener('keyup',e=>{if(map[e.key])keys[map[e.key]]=false});setInterval(save,5000);addEventListener('pagehide',save);blocked=false;
</script></body></html>
